<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout — PureGlow</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="nav scrolled">
  <div class="nav-inner">
    <a href="index.html" class="nav-logo"><img src="assets/images/logo-blue.png" alt="pureglow" style="height:36px"></a>
    <div style="font-size:0.75rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--color-text-light)">Secure Checkout</div>
    <div class="nav-actions"><div class="lang-switcher"><button data-lang="en">EN</button><span class="sep">|</span><button data-lang="es">ES</button></div><div class="currency-selector"><button class="currency-btn active" data-currency="USD">USD</button><span class="sep">|</span><button class="currency-btn" data-currency="COP">COP</button><span class="sep">|</span><button class="currency-btn" data-currency="GBP">GBP</button></div></div>
  </div>
</nav>

<section class="section" style="padding-top:140px">
  <div class="container">
    <div class="checkout-layout">
      <div>
        <div class="checkout-steps">
          <div class="checkout-step active"><div class="num">1</div><div class="label" data-translate="co.contact">Contact</div></div>
          <div class="checkout-step"><div class="num">2</div><div class="label" data-translate="co.shipping">Shipping</div></div>
          <div class="checkout-step"><div class="num">3</div><div class="label" data-translate="co.payment">Payment</div></div>
          <div class="checkout-step"><div class="num">4</div><div class="label" data-translate="co.confirm">Done</div></div>
        </div>
        <div id="checkout-content" style="background:var(--color-white);padding:40px;border:1px solid var(--color-border)"></div>
        <div style="text-align:center;margin-top:30px;font-size:0.8rem;color:var(--color-text-light)">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" style="vertical-align:middle;margin-right:6px"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
          SSL-encrypted · 100% secure · Trusted by 25,000+ customers
        </div>
      </div>

      <div class="summary-box" style="position:sticky;top:100px">
        <h3 data-translate="co.summary">Order summary</h3>
        <div id="cart-page-items"></div>
        <div class="summary-row"><span data-translate="cart.subtotal">Subtotal</span><span id="sum-sub">$0.00</span></div>
        <div class="summary-row"><span data-translate="cart.shipping">Shipping</span><span id="sum-ship">Free</span></div>
        <div class="summary-row"><span data-translate="cart.tax">Tax</span><span id="sum-tax">$0.00</span></div>
        <div class="summary-row total"><span data-translate="cart.total">Total</span><span id="sum-total">$0.00</span></div>
      </div>
    </div>
  </div>
</section>

<footer class="footer" style="padding:40px 0">
  <div class="container">
    <div class="footer-bottom" style="border:none;padding:0"><div data-translate="f.rights">© 2026 PureGlow.</div><div>SSL Secure · Lab Tested</div></div>
  </div>
</footer>

<script src="js/translations.js"></script>
<script src="js/currency.js"></script>
<script src="js/cart.js"></script>
<script src="js/main.js"></script>
</body>
</html>
